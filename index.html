@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}

/* \u2500\u2500 Toast \u2500\u2500 */
@keyframes toastIn{from{opacity:0;transform:translateY(16px) scale(.96)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes toastOut{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(8px)}}
.toast-wrap{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0) + 20px);z-index:9999;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding:0 16px}
.toast{max-width:400px;width:auto;pointer-events:auto;display:flex;align-items:center;gap:10px;padding:12px 16px;border-radius:12px;font-size:14px;font-weight:500;line-height:1.4;box-shadow:0 6px 24px rgba(0,0,0,.16),0 2px 6px rgba(0,0,0,.08);animation:toastIn .28s cubic-bezier(.2,.9,.3,1.2);backdrop-filter:blur(8px)}
.toast-ok{background:#2E5D45;color:#fff}
.toast-err{background:#C0574E;color:#fff}
.toast-info{background:#3A4A5A;color:#fff}
.toast-icon{flex-shrink:0;width:18px;height:18px;display:flex;align-items:center;justify-content:center}


/* \u2500\u2500 Light (default) \u2500\u2500 */
:root{
  --bg:#F6F4EF;
  --surface:#FFFFFF;
  --surface2:#F9F7F2;
  --surface3:#F1EEE7;
  --sep:#DDD8CD;
  --border:#E5E1D8;
  --border2:#DDD8CD;
  --overlay:rgba(42,37,32,.42);
  --text:#2A2520;
  --text2:#78706A;
  --text3:#A8A099;
  --accent:#C9A24E;
  --accent-light:#D9B46A;
  --accent-dark:#A8842E;
  --accent-bg:rgba(201,162,78,.08);
  --accent-border:rgba(201,162,78,.22);
  --btn-bg:#C9A24E;
  --btn-text:#FFFFFF;
  --green:#3A7057;
  --green-light:#667452;
  --green-bg:rgba(77,134,107,.09);
  --green-mid:#2D5E47;
  --red:#C0574E;
  --red-bg:rgba(192,87,78,.09);
  --blue:#3E6A8F;
  --blue-bg:rgba(92,127,163,.09);
  --amber:#D99A3E;
  --amber-bg:rgba(217,154,62,.1);
  --purple:#B385CC;
  --purple-bg:rgba(179,133,204,.09);
  --shadow-xs:0 1px 3px rgba(31,41,55,.06),0 1px 2px rgba(31,41,55,.04);
  --shadow-sm:0 2px 8px rgba(31,41,55,.08),0 1px 3px rgba(31,41,55,.05);
  --shadow-md:0 8px 24px rgba(31,41,55,.1),0 2px 8px rgba(31,41,55,.06);
  --shadow-lg:0 20px 48px rgba(31,41,55,.14),0 4px 12px rgba(31,41,55,.08);
  --r-xs:4px;--r-sm:8px;--r-md:11px;--r-lg:14px;--r-xl:18px;
}

[data-theme="dark"] body::before{mix-blend-mode:screen;opacity:.25}
body{font-family:'Inter',system-ui,-apple-system,sans-serif;font-size:14px;font-weight:450;overflow-x:hidden;max-width:100vw;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;letter-spacing:-.006em}

.big-num{letter-spacing:-.02em;font-feature-settings:'tnum' 1;font-variant-numeric:tabular-nums}
input,textarea,select{font-family:inherit;color:var(--text);background:transparent}

/* \u2500\u2500 PDF / YAZDIRMA \u2500\u2500 */
@media print{
  @page{size:148mm 210mm;margin:0}
  html,body{background:#fff!important;margin:0;padding:0}
  body::before{display:none!important}
  body *{visibility:hidden!important}
  #pdf-area,#pdf-area *{visibility:visible!important}
  #pdf-area{position:absolute!important;left:0;top:0;width:148mm;display:block!important}
  .pdf-blok{break-inside:avoid;page-break-inside:avoid}
  .pdf-tbl{width:100%;border-collapse:collapse}
  .pdf-tbl thead{display:table-header-group}
  .pdf-tbl tfoot{display:table-footer-group}
  .pdf-tbl tr{break-inside:avoid!important;page-break-inside:avoid!important}
  .pdf-akis{break-inside:auto;page-break-inside:auto}
  h3,.pdf-bolum{break-after:avoid;page-break-after:avoid}
  *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}
}
#pdf-area{display:none}

@supports (-webkit-touch-callout:none){

}
